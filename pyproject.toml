[project]
name = "taxor-screening-task"
version = "0.1.0"
description = "Evaluate multimodal LLMs on extracting structured data from handwritten Indian bills/receipts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "rapidfuzz>=3.9.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
